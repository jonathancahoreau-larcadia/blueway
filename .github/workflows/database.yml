name: Database service
on:
  pull_request:
    paths: ['backend/app/infrastructure/database/**', 'backend/tests/database/**', 'compose.database.yml', '.github/workflows/database.yml']
  push:
    branches: [dev]
    paths: ['backend/app/infrastructure/database/**', 'backend/tests/database/**', 'compose.database.yml', '.github/workflows/database.yml']
permissions:
  contents: read
jobs:
  postgis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: blueway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d blueway_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/tests/database/requirements.txt
      - run: python -m pytest backend/tests/database -q --junitxml=database-test-results.xml
        env:
          BLUEWAY_TEST_ADMIN_URL: postgresql://postgres:ci-test-only@localhost:5432/blueway_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-results
          path: database-test-results.xml
