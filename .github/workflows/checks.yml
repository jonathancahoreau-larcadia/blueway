name: PR checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Check Python correctness
        run: ruff check backend --output-format=github
      - name: API and unit tests
        if: ${{ !cancelled() }}
        run: python -m pytest backend/tests/api backend/tests/unit -q --junitxml=test-results/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: test-results/
          retention-days: 14
      - name: Summary
        if: always()
        run: echo "Python checks — ${{ job.status }}. Test report available in workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
  flutter:
    name: Flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter
        if: ${{ !cancelled() }}
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ../test-results
          set -o pipefail
          flutter test --no-pub --machine --coverage | tee ../test-results/flutter.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-test-results
          path: |
            test-results/
            mobile/coverage/lcov.info
          retention-days: 14
      - name: Summary
        if: always()
        run: echo "Flutter checks — ${{ job.status }}. Test report and coverage available in workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
